<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="President, an online card game for private groups.">
    <title>President</title>
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <main>
      <section class="game-panel" aria-labelledby="page-title">
        <h1 id="page-title">President</h1>
        <p class="subtitle">An online card game for private groups of friends and family.</p>

        <div class="actions" aria-label="Room actions">
          <button type="button" disabled>Create Room</button>
          <button type="button" disabled>Join Room</button>
        </div>

        <p
          id="connection-status"
          class="status"
          data-state="disconnected"
          role="status"
          aria-live="polite"
        >Disconnected</p>
        <p class="next-step">Room functionality will be added in the next stage.</p>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
